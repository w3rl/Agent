<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120914" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Emin misin?</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;min-height:100%;overflow:hidden;background:#0b070c}
    body{min-height:100svh;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:radial-gradient(circle at 50% 10%,#42152f 0,#21101c 37%,#0e090f 70%,#080608 100%)}
    .screen{min-height:100svh;width:100%;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
    .card{width:100%;max-width:430px;padding:clamp(28px,6svh,46px) 20px 22px;text-align:center;border:1px solid rgba(255,255,255,.11);border-radius:28px;background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.42)}
    .face{font-size:46px;line-height:1;margin-bottom:15px}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,11vw,56px);line-height:1;font-weight:500;letter-spacing:-.03em;margin:0 0 16px;text-wrap:balance}
    p{font-size:clamp(15px,4vw,17px);line-height:1.52;color:rgba(255,255,255,.72);margin:0 auto 25px;max-width:340px;text-wrap:balance}
    .actions{width:100%;display:grid;gap:10px}
    .btn{width:100%;min-height:58px;border-radius:18px;border:0;font-size:16px;font-weight:750;text-decoration:none;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;transition:transform .14s ease,background .14s ease}
    .btn:active{transform:scale(.975)}
    .back{background:#fff;color:#351126;box-shadow:0 12px 34px rgba(255,255,255,.13)}
    .no{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.14)}
    .tiny{font-size:11px;opacity:.32;margin-top:16px}
    @media(max-height:620px){.card{padding:20px 18px}.face{font-size:34px;margin-bottom:9px}h1{font-size:34px;margin-bottom:10px}p{font-size:14px;line-height:1.4;margin-bottom:16px}.btn{min-height:50px}.tiny{margin-top:10px}}
  </style>
</head>
<body>
  <main class="screen">
    <section class="card">
      <div class="face">🥺</div>
      <h1>Emin misin?</h1>
      <p>Bir daha düşünmek istersen geri dönebilirsin. Ama yine de kararın hayırsa, buna da saygı duyuyorum.</p>
      <div class="actions">
        <a class="btn back" href="index.html">Bir daha düşüneyim ♡</a>
        <button class="btn no" id="no" type="button">Yine de hayır</button>
      </div>
      <div class="tiny">Son karar senin.</div>
    </section>
  </main>
  <script>
    document.getElementById('no').addEventListener('click',()=>{
      location.href='https://www.youtube.com/watch?v=odoK04z8exU&list=RDodoK04z8exU&start_radio=1';
    });
  </script>
</body>
</html>
